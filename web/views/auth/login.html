<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASSHINE — Iniciar sesión</title>
<link rel="icon" href="../../images/logo-jasshine.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/login.css">
</head>
<body>

<div class="split">
  <!-- LADO IZQUIERDO -->
  <div class="side">
    <a class="brand" href="../../index.html">
      <img src="../../images/logo-jasshine.png" alt="JASSHINE">
      <span>JASSHINE</span>
    </a>
    <div class="side-copy">
      <h1>JASS<span>HINE</span></h1>
      <div class="side-sub">LAVADERO INTELIGENTE</div>
      <p>Porque cada minuto<br>y cada moto cuentan.</p>
      <div class="side-line"></div>
    </div>
  </div>

  <!-- LADO DERECHO -->
  <div class="side form-side">
    <div class="form-card">
      <h2>Bienvenido de nuevo</h2>
      <p class="form-sub">Ingresa tus credenciales para continuar</p>

      <form id="login-form">
        <label>Correo electrónico</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="correo@ejemplo.com" required>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" opacity="0"/><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        </div>

        <label>Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" required>
          <svg id="toggle-pass" class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <a href="recuperar-contrasena.html" class="forgot">¿Olvidaste tu contraseña?</a>

        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>

        <div class="divider"><span>Ingresar como</span></div>

        <div class="role-group" id="role-group">
          <button type="button" class="role-btn" data-role="administrador" data-target="../inicio/inicio-admin.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Admin
          </button>
          <button type="button" class="role-btn active" data-role="cliente" data-target="../inicio/inicio-cliente.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
            Cliente
          </button>
          <button type="button" class="role-btn" data-role="empleado" data-target="../inicio/inicio-empleado.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            Empleado
          </button>
        </div>
      </form>

      <div class="signup-note">¿No tienes cuenta? <a href="registro.html">Regístrate</a></div>
    </div>
  </div>
</div>

<script src="../../js/login.js"></script>
</body>
</html>
