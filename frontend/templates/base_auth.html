<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASSHINE — {% block titulo %}{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='images/logo-jasshine.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/' ~ css) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/a11y.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/nojs.css') }}">
</head>
<body>
<a href="#main-content" class="skip-link">Saltar al contenido principal</a>

<div class="split">
  <div class="side">
    <a class="brand" href="{{ url_for('public.index') }}">
      <img src="{{ url_for('static', filename='images/logo-jasshine.png') }}" alt="JASSHINE">
      <span>JASSHINE</span>
    </a>
    <div class="side-copy">
      {% block side_copy %}
      <h1>JASS<span>HINE</span></h1>
      <div class="side-sub">LAVADERO INTELIGENTE</div>
      <p>Porque cada minuto<br>y cada moto cuentan.</p>
      <div class="side-line"></div>
      {% endblock %}
    </div>
  </div>

  <main class="side form-side" id="main-content" tabindex="-1">
    {% block form %}{% endblock %}
  </main>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
